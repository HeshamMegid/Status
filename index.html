<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hesham’s Status</title>
<meta name="description" content="Live status of Hesham’s head. Migraine attacks, reported as incidents.">
<meta property="og:title" content="Hesham’s Status">
<meta property="og:description" content="Live status of Hesham’s head. Migraine attacks, reported as incidents.">
<meta property="og:url" content="https://status.hesh.am">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
/* A single-column status page (850px), deliberately light-only like the pages it mirrors. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #333333;
  --muted: #737373;
  --faint: #aaaaaa;
  --line: #e0e0e0;
  --accent: #5959d9;           /* Ease iris */
  --ok: #2fcc66;
  --minor: #f1c40f;
  --minor-text: #b7950b;
  --partial: #e67e22;
  --major: #e74c3c;
  --info: #3498db;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 64px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.container { max-width: 850px; margin: 0 auto; }

/* Header */
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 48px 40px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; color: var(--fg); }
.logo:hover { text-decoration: none; }
.logo-mark { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.logo-text { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.logo-text span { color: var(--muted); font-weight: 400; }
.subscribe { position: relative; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.sub-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 16px; z-index: 5; display: grid; gap: 10px; }
.sub-panel p { margin: 0; font-size: 14px; color: var(--muted); }
.sub-panel a.btn { text-align: center; }
.sub-panel a.btn:hover { text-decoration: none; }

/* Overall status */
.page-status { border-radius: 4px; padding: 16px 20px; color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 40px; background: var(--ok); }
.page-status.loading { background: var(--faint); }
.page-status.error { background: var(--muted); }
.page-status small { display: block; font-size: 14px; font-weight: 400; opacity: .9; }

/* Active incident */
.incident-box { border: 1px solid var(--c); border-radius: 4px; margin-bottom: 32px; overflow: hidden; }
.incident-box > header { background: var(--c); color: #fff; padding: 12px 20px; font-size: 17px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.incident-box > header small { font-weight: 400; opacity: .9; font-size: 13px; align-self: center; }
.incident-box .updates { padding: 4px 20px; }
.update { padding-block: 14px; border-bottom: 1px solid var(--line); }
.update:last-child { border-bottom: 0; }
.update p { margin: 0; }
.update time { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }

/* Components */
.caption { display: flex; justify-content: flex-end; color: var(--muted); font-size: 13px; margin-bottom: 8px; gap: 4px; flex-wrap: wrap; }
.components { border: 1px solid var(--line); border-radius: 4px; }
.component { padding: 18px 20px; border-bottom: 1px solid var(--line); }
.component:last-child { border-bottom: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; }
.help { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--faint); color: var(--faint); font-size: 11px; display: inline-grid; place-items: center; cursor: help; position: relative; flex: none; }
.help:hover::after, .help:focus::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: #333; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 12px; white-space: nowrap; z-index: 4; }
.status { font-size: 14px; white-space: nowrap; }
.bars { margin-top: 12px; }
.bars svg { display: block; width: 100%; height: 34px; }
.bars rect { cursor: pointer; }
.bars rect:hover { opacity: .7; }
.legend { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.legend .spacer { flex: 1; height: 1px; background: var(--line); }

.tooltip { position: absolute; z-index: 6; width: 280px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 12px 14px; font-size: 13px; pointer-events: none; }
.tooltip strong { display: block; margin-bottom: 6px; font-size: 14px; }
.tooltip .tt-row { display: flex; gap: 8px; align-items: flex-start; padding-block: 3px; }
.tooltip .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; margin-top: 4px; }
.tooltip .none { color: var(--muted); }

/* Metrics */
h2 { font-size: 24px; font-weight: 500; margin: 56px 0 16px; text-wrap: balance; }
.metric { border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; margin-bottom: 16px; }
.metric .row .val { font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; }
.metric .row .val small { font-size: 13px; color: var(--muted); }
.metric svg { display: block; width: 100%; height: 120px; margin-top: 8px; overflow: visible; }
.metric .note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

/* Past incidents */
.day { margin-bottom: 28px; }
.day h3 { font-size: 17px; font-weight: 500; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.day .empty { color: var(--muted); margin: 0; font-size: 14px; }
.incident { margin-bottom: 20px; }
.incident-title { font-size: 17px; font-weight: 600; margin: 0 0 6px; color: var(--c); }
.incident .update { padding-block: 6px; border: 0; }
.incident .update p { font-size: 14.5px; }

footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; color: var(--faint); font-size: 13px; gap: 12px; flex-wrap: wrap; }
footer a { color: var(--muted); }

@media (max-width: 560px) {
  .logo-text { font-size: 20px; }
  .page-status { font-size: 17px; }
}
</style>
</head>
<body>
<div class="container">
  <header class="masthead">
    <a class="logo" href="/" aria-label="Hesham’s Status">
      <div class="logo-mark" aria-hidden="true">H</div>
      <div class="logo-text">Hesham’s <span>Status</span></div>
    </a>
    <div class="subscribe">
      <button class="btn" id="subBtn" aria-expanded="false" aria-controls="subPanel">Subscribe to updates</button>
      <div class="sub-panel" id="subPanel" hidden>
        <p>Notifications aren’t available yet. This page runs on Ease, a migraine tracker for iPhone, and you can keep the same record of your own attacks.</p>
        <a class="btn" href="https://hesh.am/apps/ease">Get Ease</a>
      </div>
    </div>
  </header>

  <main id="app">
    <div class="page-status loading">Checking status…</div>
  </main>

  <footer>
    <span>Powered by <a href="https://hesh.am/apps/ease">Ease</a></span>
    <span id="tzNote"></span>
  </footer>
</div>

<div class="tooltip" id="tooltip" hidden></div>

<script>
(() => {
  const DATA_URL = 'https://us-central1-ease-b121d.cloudfunctions.net/publicStatus';
  const NAME = 'Hesham';

  // ---------- Vocabulary from the app (Attack.swift) ----------
  const SEVERITY = { 1: 'Mild', 2: 'Moderate', 3: 'Severe' };
  const SEV_DESC = { 1: 'I can still go', 2: 'I have to slow down', 3: 'I have to stop' };
  const IMPACT = {
    1: { status: 'Degraded Performance', color: 'var(--minor)', text: 'var(--minor-text)', title: 'Degraded performance' },
    2: { status: 'Partial Outage', color: 'var(--partial)', text: 'var(--partial)', title: 'Partial outage' },
    3: { status: 'Major Outage', color: 'var(--major)', text: 'var(--major)', title: 'Major outage' },
  };
  const DURATIONS = [
    { label: '1-4 hours', min: 1.5, max: 4 },
    { label: '4-6 hours', min: 4, max: 6 },
    { label: '6-8 hours', min: 6, max: 8 },
    { label: 'More than 8 hours', min: 8.5, max: 14 },
  ];
  const PERIODS = [
    { name: 'Morning', start: 6, span: 6 },
    { name: 'Afternoon', start: 12, span: 6 },
    { name: 'Evening', start: 18, span: 4 },
    { name: 'Night', start: 22, span: 8 },
  ];
  const EFFECT = ['Helped', "Didn't help", 'Made it worse'];

  // Seven components covering every built-in symptom in the app. Pain is
  // affected by every attack, since severity is pain severity.
  const COMPONENTS = [
    { id: 'pain', name: 'Pain', tip: 'Headache pain. Affected by every attack', symptoms: ['Throbbing pain', 'Pulsating pain'] },
    { id: 'vision', name: 'Vision', tip: 'Aura, blind spots, blurred vision, scintillations, vision loss', symptoms: ['Aura', 'Blind spots', 'Blurred vision', 'Scintillations', 'Temporary vision loss'] },
    { id: 'senses', name: 'Senses', tip: 'Sensitivity to light, sound or smell', symptoms: ['Sensitivity to light', 'Sensitivity to sound', 'Sensitivity to smell'] },
    { id: 'stomach', name: 'Stomach', tip: 'Nausea, vomiting, bowels, appetite', symptoms: ['Nausea', 'Vomiting', 'Diarrhea', 'Constipation', 'Loss of appetite', 'Food cravings'] },
    { id: 'nerves', name: 'Nerves', tip: 'Numbness, tingling, aphasia, dizziness', symptoms: ['Numbness', 'Tingling', 'Aphasia', 'Dizziness'] },
    { id: 'mind', name: 'Mind', tip: 'Concentration and mood', symptoms: ['Difficulty concentrating', 'Depression', 'Euphoria', 'Irritability', 'Mood changes'] },
    { id: 'body', name: 'Body', tip: 'Fatigue, weakness, temperature, urination', symptoms: ['Fatigue', 'Weakness', 'Muscle weakness', 'Chills', 'Hot flashes', 'Sweating', 'Increased urination'] },
  ];
  const compFor = s => COMPONENTS.filter(c => c.symptoms.includes(s)).map(c => c.id);
  const componentsFor = symptoms => [...new Set(['pain', ...symptoms.flatMap(compFor)])];

  // ---------- Helpers ----------
  const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const DAY = 864e5;
  const now = new Date();
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const dayStart = offset => new Date(today.getTime() - offset * DAY);
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const fmtDay = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const fmtStamp = d => d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short' }).replace(',', '').replace(/ (\d\d:)/, ', $1');
  const addH = (d, h) => new Date(d.getTime() + h * 36e5);
  const listify = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  const compNames = ids => COMPONENTS.filter(c => ids.includes(c.id)).map(c => c.name);
  const doseLabel = d => d ? `${d.quantity > 1 ? d.quantity + ' × ' : ''}${d.strength != null ? d.strength : ''}${d.unit || ''}`.trim() : '';
  const reliefLabel = m => m.name + (m.dose && doseLabel(m.dose) ? ` ${doseLabel(m.dose)}` : '');

  // ---------- Feed -> incidents ----------
  function toAttack(r) {
    const period = PERIODS[r.timePeriod] || PERIODS[0];
    const d = new Date(r.onset);
    // symptomsStart.date carries the day; the time period carries the part of day.
    const onset = (d.getHours() >= period.start && d.getHours() < period.start + period.span) ? d
      : addH(new Date(d.getFullYear(), d.getMonth(), d.getDate()), period.start + period.span / 2);
    const dur = r.duration != null ? DURATIONS[r.duration] : null;
    // No duration yet on today's attack means it's still going ("log now or later").
    const ongoing = !dur && sameDay(onset, today) && onset <= now;
    const hours = dur ? (dur.min + dur.max) / 2 : 2.5;
    return {
      active: ongoing, severity: Math.max(1, r.severity || 0), onset,
      end: ongoing ? null : addH(onset, hours), duration: dur ? dur.label : null,
      symptoms: r.symptoms || [], triggers: r.triggers || [],
      reliefMethodDetails: r.reliefMethodDetails || (r.reliefMethods || []).map(name => ({ name })),
      weather: r.weather, sleep: r.sleep,
      components: componentsFor(r.symptoms || []),
    };
  }

  function incidentTitle(a) {
    const names = compNames(a.components);
    const shown = names.length > 3 ? names.slice(0, 2).concat(`${names.length - 2} more`) : names;
    return `${IMPACT[a.severity].title} affecting ${listify(shown)}`;
  }

  function contextLine(a) {
    const parts = [];
    if (a.triggers.length) parts.push(`Contributing factors: ${listify(a.triggers.map(t => t.toLowerCase()))}.`);
    const dp = a.weather && a.weather.pressureChange24h;
    if (dp != null && Math.abs(dp) >= 3) parts.push(`Barometric pressure ${dp < 0 ? 'fell' : 'rose'} ${Math.abs(dp).toFixed(1)} hPa in the 24 hours before onset.`);
    const s = a.sleep;
    const dev = s && s.baselineHours != null ? s.hoursAsleep - s.baselineHours : 0;
    if (dev <= -1) parts.push(`Only ${s.hoursAsleep.toFixed(1)}h of sleep the night before, ${Math.abs(dev).toFixed(1)}h below baseline.`);
    return parts.join(' ');
  }

  function updates(a) {
    const u = [];
    const sym = a.symptoms.map(s => s.toLowerCase());
    u.push({ kind: 'Investigating', at: a.onset, text: `We are investigating ${sym.length ? 'reports of ' + listify(sym) : 'reports of a headache'}. Severity: ${SEVERITY[a.severity]} (“${SEV_DESC[a.severity]}”).` });
    const ctx = contextLine(a);
    if (ctx) u.push({ kind: 'Identified', at: addH(a.onset, 0.3), text: `The issue has been identified. ${ctx}` });
    if (a.reliefMethodDetails.length) {
      u.push({ kind: 'Monitoring', at: addH(a.onset, 0.6), text: `A fix has been applied (${listify(a.reliefMethodDetails.map(reliefLabel))}) and we are monitoring the results.` });
    }
    if (!a.active) {
      const verdicts = a.reliefMethodDetails.filter(m => m.effectiveness != null).map(m => `${reliefLabel(m)}: ${EFFECT[m.effectiveness].toLowerCase()}`);
      let txt = `This incident has been resolved.${a.duration ? ` Duration: ${a.duration}.` : ''}`;
      if (verdicts.length) txt += ` Post-incident review: ${verdicts.join('; ')}.`;
      u.push({ kind: 'Resolved', at: a.end, text: txt });
    }
    return u.reverse();
  }

  const updateHTML = up => `<div class="update"><p><strong>${up.kind}</strong> - ${esc(up.text)}</p><time>${fmtStamp(up.at)}</time></div>`;

  // ---------- Uptime ----------
  const dayHits = (ids, offset, list) => list.filter(a => sameDay(a.onset, dayStart(offset)) && a.components.some(c => ids.includes(c)));
  function uptime(ids, list) {
    const from = dayStart(89);
    let down = 0;
    list.forEach(a => { if (a.onset >= from && a.components.some(c => ids.includes(c))) down += ((a.end || now) - a.onset) / 36e5; });
    return Math.max(0, 100 - down / (90 * 24) * 100);
  }

  function barsSVG(ids, list) {
    const n = 90, w = 3, gap = 2.1;
    let rects = '';
    for (let i = 0; i < n; i++) {
      const off = n - 1 - i;
      const worst = dayHits(ids, off, list).reduce((m, a) => Math.max(m, a.severity), 0);
      rects += `<rect x="${i * (w + gap)}" y="0" width="${w}" height="34" rx="1" fill="${worst ? IMPACT[worst].color : 'var(--ok)'}" data-off="${off}" data-comps="${ids.join(',')}"></rect>`;
    }
    return `<svg viewBox="0 0 ${n * (w + gap) - gap} 34" preserveAspectRatio="none" role="img" aria-label="90 day uptime">${rects}</svg>`;
  }

  function componentHTML(c, list, active) {
    const st = active && active.components.includes(c.id) ? IMPACT[active.severity] : null;
    return `<div class="component">
      <div class="row"><div class="name">${c.name} <span class="help" tabindex="0" data-tip="${c.tip}">?</span></div>
      <span class="status" style="color:${st ? st.text : 'var(--ok)'}">${st ? st.status : 'Operational'}</span></div>
      <div class="bars">${barsSVG([c.id], list)}</div>
      <div class="legend"><span>90 days ago</span><span class="spacer"></span><span>${uptime([c.id], list).toFixed(2)} % uptime</span><span class="spacer"></span><span>Today</span></div>
    </div>`;
  }

  // ---------- Metrics (the snapshot each attack captured) ----------
  function areaChart(points, { min, max, color, baseline = null, fmtY }) {
    const W = 800, H = 120;
    const t0 = points[0].t, t1 = points[points.length - 1].t;
    const x = t => (t - t0) / ((t1 - t0) || 1) * W;
    const y = v => H - (v - min) / (max - min) * H;
    const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    const area = `${line}L${x(t1)},${H}L${x(t0)},${H}Z`;
    const grid = [min, (min + max) / 2, max].map(v => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"></line><text x="${W - 2}" y="${y(v) - 4}" text-anchor="end" font-size="11" fill="var(--faint)">${fmtY(v)}</text>`).join('');
    const base = baseline != null ? `<line x1="0" x2="${W}" y1="${y(baseline)}" y2="${y(baseline)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"></line>` : '';
    const dots = points.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="${p.color}" stroke="var(--bg)" stroke-width="1.5"></circle>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${grid}<path d="${area}" fill="${color}" opacity=".12"></path>${base}<path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"></path>${dots}</svg>`;
  }

  function metricsHTML(list) {
    const recent = list.filter(a => a.onset >= dayStart(89));
    const chart = (pts, opts) => pts.length < 2 ? `<p class="note">Not enough attacks with this reading in the last 90 days.</p>` : areaChart(pts, opts);
    const pv = recent.filter(a => a.weather).map(a => ({ t: a.onset.getTime(), v: a.weather.pressureHPa, color: IMPACT[a.severity].color }));
    const sv = recent.filter(a => a.sleep).map(a => ({ t: a.onset.getTime(), v: a.sleep.hoursAsleep, color: IMPACT[a.severity].color }));
    const withBaseline = [...recent].reverse().find(a => a.sleep && a.sleep.baselineHours != null);
    const baseline = withBaseline ? withBaseline.sleep.baselineHours : null;
    const pr = pv.map(p => p.v), sr = sv.map(p => p.v);
    return `
      <div class="metric">
        <div class="row"><div class="name">Barometric pressure at onset</div><div class="val">${pv.length} <small>of ${recent.length} attacks</small></div></div>
        ${chart(pv, { min: Math.floor(Math.min(...pr, 1005) - 2), max: Math.ceil(Math.max(...pr, 1020) + 2), color: 'var(--accent)', fmtY: v => v.toFixed(0) + ' hPa' })}
        <p class="note">One point per attack in the last 90 days, colored by severity.</p>
      </div>
      <div class="metric">
        <div class="row"><div class="name">Sleep the night before</div><div class="val">${sv.length} <small>of ${recent.length} attacks</small></div></div>
        ${chart(sv, { min: Math.max(0, Math.floor(Math.min(...sr, 5) - 1)), max: Math.ceil(Math.max(...sr, 8) + 0.5), color: 'var(--info)', baseline, fmtY: v => v.toFixed(1) + 'h' })}
        <p class="note">${baseline != null ? `Dashed line is the ${baseline.toFixed(1)}h baseline.` : 'From Apple Health.'}</p>
      </div>`;
  }

  // ---------- Render ----------
  const app = document.getElementById('app');
  const tooltip = document.getElementById('tooltip');
  let list = [];

  function render(feed) {
    const all = feed.attacks.map(toAttack).sort((a, b) => a.onset - b.onset);
    const active = all.find(a => a.active) || null;
    list = all;
    let html = '';

    if (active) {
      const since = active.onset.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      html += `<section class="incident-box" style="--c:${IMPACT[active.severity].color}">
        <header><span>${incidentTitle(active)}</span><small>Ongoing since ${since}</small></header>
        <div class="updates">${updates(active).map(updateHTML).join('')}</div>
      </section>`;
    } else {
      html += `<div class="page-status">All Systems Operational</div>`;
    }

    html += `<div class="caption"><span>Uptime over the past 90 days.</span></div>`;
    html += `<section class="components">${COMPONENTS.map(c => componentHTML(c, all, active)).join('')}</section>`;

    html += `<h2>System Metrics</h2>${metricsHTML(all)}`;

    html += `<h2 id="history">Past Incidents</h2>`;
    for (let off = 0; off < 15; off++) {
      const d = dayStart(off);
      const day = all.filter(a => sameDay(a.onset, d)).sort((a, b) => b.onset - a.onset);
      html += `<div class="day"><h3>${fmtDay(d)}</h3>`;
      html += day.length ? day.map(a => `<div class="incident" style="--c:${IMPACT[a.severity].text}"><p class="incident-title">${incidentTitle(a)}</p>${updates(a).map(updateHTML).join('')}</div>`).join('')
        : `<p class="empty">No incidents reported${off === 0 ? ' today' : ''}.</p>`;
      html += `</div>`;
    }

    app.innerHTML = html;
  }

  function renderError() {
    app.innerHTML = `<div class="page-status error">Status unavailable<small>The status feed couldn’t be reached. Ironic, we know. Try again in a minute.</small></div>`;
  }

  // ---------- Interactions ----------
  app.addEventListener('mouseover', e => {
    const rect = e.target.closest('rect[data-off]');
    if (!rect) return;
    const off = +rect.dataset.off;
    const hits = dayHits(rect.dataset.comps.split(','), off, list);
    const body = hits.length
      ? hits.map(a => `<div class="tt-row"><span class="dot" style="background:${IMPACT[a.severity].color}"></span><span>${incidentTitle(a)}<br><span class="none">${a.active ? 'Ongoing' : (a.duration || 'Duration not logged')}</span></span></div>`).join('')
      : `<div class="none">No downtime recorded on this day.</div>`;
    tooltip.innerHTML = `<strong>${fmtDay(dayStart(off))}</strong>${body}`;
    tooltip.hidden = false;
    const br = rect.getBoundingClientRect();
    tooltip.style.left = Math.min(Math.max(8, br.left + br.width / 2 - 140), document.documentElement.clientWidth - 288) + scrollX + 'px';
    tooltip.style.top = br.bottom + 8 + scrollY + 'px';
  });
  app.addEventListener('mouseout', e => { if (e.target.closest('rect[data-off]')) tooltip.hidden = true; });

  const subBtn = document.getElementById('subBtn'), subPanel = document.getElementById('subPanel');
  const setSub = open => { subPanel.hidden = !open; subBtn.setAttribute('aria-expanded', String(open)); };
  subBtn.addEventListener('click', () => setSub(subPanel.hidden));
  document.addEventListener('click', e => { if (!subPanel.hidden && !e.target.closest('.subscribe')) setSub(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !subPanel.hidden) { setSub(false); subBtn.focus(); } });

  document.getElementById('tzNote').textContent = 'Times shown in ' + Intl.DateTimeFormat().resolvedOptions().timeZone;

  // Local testing can point at another feed: http://localhost:4000/?data=/status.json
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const url = (local && new URLSearchParams(location.search).get('data')) || DATA_URL;
  fetch(url)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(renderError);
})();
</script>
</body>
</html>
